[project]
name = "research-swarm"
version = "0.1.0"
description = "A local-first research harness with Codex and DSPy ReAct backends, search/fetch/archive tools, run logging, and parallel mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dmarzzz" }]
dependencies = [
    "dspy>=2.6,<4",
    "arxiv>=2.1",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# codex-control pin includes the app-server stdio large-frame fix:
# https://github.com/cybernetic-physics/codex-control/commit/170eda705751d374df43d403f44546d50ca098fc
# codex-env pin:
# https://github.com/cybernetic-physics/codex-env/commit/2ae3b36c8771b4605d5d5ff2a03a2a4c0f2af996
codex = [
    "codex-control @ git+https://github.com/cybernetic-physics/codex-control.git@170eda705751d374df43d403f44546d50ca098fc",
    "codex-env @ git+https://github.com/cybernetic-physics/codex-env.git@2ae3b36c8771b4605d5d5ff2a03a2a4c0f2af996",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
research-agent = "research_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
