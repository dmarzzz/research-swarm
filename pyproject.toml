[project]
name = "research-swarm"
version = "0.1.0"
description = "A DSPy ReAct research agent: one-shot and STORM-parallel modes, local-first caching, trafilatura extraction, self-critique."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dmarzzz" }]
dependencies = [
    "dspy>=2.6,<4",
    "arxiv>=2.1",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
research-agent = "research_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
